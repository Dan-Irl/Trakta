name: trakta_app
description: Trakta – traktamente och milersättning, helt offline.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

# NOTE: the app must never depend on networking packages (http, dio, Firebase,
# analytics…). tool/bin/check_offline.dart enforces this in CI.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  trakta_core:
    path: ../../packages/trakta_core

  drift: ^2.32.0
  sqlite3: ^3.0.0
  flutter_riverpod: ^3.0.0
  go_router: ">=16.0.0 <19.0.0"
  flutter_secure_storage: ^11.2.0
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.0
  timezone: ">=0.9.4 <0.12.0"
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  build_runner: ^2.5.0
  drift_dev: ^2.32.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/rules/

# App icon, generated from the masters in /design (see design/DESIGN.md).
# Regenerate after changing them: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: ../../design/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#13417C"
  adaptive_icon_foreground: ../../design/app_icon_adaptive.png
  adaptive_icon_foreground_inset: 0
