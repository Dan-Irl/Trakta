# OpenSSF Scorecard: checks the repository's security practices (pinned
# actions, token permissions, branch protection, …) and publishes the score
# for the badge in the README. Results also appear under Security → Code
# scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
