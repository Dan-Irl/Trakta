# Release. Push a tag vX.Y.Z (matching `version:` in
# apps/trakta_app/pubspec.yaml) on a commit in main:
#
#   checks ─┐
#   prepare ┴─> android-apk  ─> signed APK + checksums + provenance ─┐
#           ├─> android-play ─> Google Play, internal testing track ─┼─> draft GitHub release
#           └─> ios          ─> TestFlight (skipped until set up) ───┘
#
# Nothing reaches users by itself. The GitHub release is a draft: install its
# APK on a real phone over the previous version, then publish the draft
# (release-published.yml then updates the download page on trakta.app). Play
# builds are promoted by hand in Play Console. See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Release only reviewed commits."
            exit 1
          fi
      - name: Tag matches the app version
        id: version
        run: |
          version=$(grep -E '^version:' apps/trakta_app/pubspec.yaml | awk '{print $2}')
          name=${version%%+*}
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version (expected v$name)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has notes for this version
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          notes=$(awk -v v="$NAME" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no notes under '## [$NAME]'."
            exit 1
          fi
      - name: Rules pack for this income year is bundled
        run: |
          year=$(date +%Y)
          test -f "apps/trakta_app/assets/rules/$year.json" || { echo "::error::No rules pack for $year."; exit 1; }
          if [ "$(date +%m)" = "12" ] && [ ! -f "apps/trakta_app/assets/rules/$((year + 1)).json" ]; then
            echo "::warning::December release without a rules pack for $((year + 1))."
          fi

  android-apk:
    # The APK for direct download (trakta.app, GitHub, Obtainium, IzzyOnDroid),
    # signed with the release key. Play builds are signed by Google instead,
    # so the two cannot be installed over each other (docs/releasing.md).
    needs: [checks, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
      RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Application ID is the one configured for publishing
        run: |
          if [ -z "$PACKAGE_NAME" ] || [ -z "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Set the variables ANDROID_PACKAGE_NAME and ANDROID_RELEASE_CERT_SHA256 (docs/releasing.md)."
            exit 1
          fi
          grep -q "applicationId = \"$PACKAGE_NAME\"" apps/trakta_app/android/app/build.gradle.kts || {
            echo "::error::applicationId in build.gradle.kts is not $PACKAGE_NAME."
            exit 1
          }
      - uses: ./.github/actions/setup-app
        with:
          android: 'true'
          cache: 'false'
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        working-directory: apps/trakta_app/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The release key secrets are missing in the release environment."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Build APK
        working-directory: apps/trakta_app
        run: flutter build apk --release --dart-define=TRAKTA_CHANNEL=github
      - name: Merged release manifest has no INTERNET permission
        run: dart run tool/bin/check_offline.dart
      - name: APK is signed with the release key
        run: |
          apk=apps/trakta_app/build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          actual=$(grep -m1 -E 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          expected=$(echo "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed with $actual, not the release key $expected."
            exit 1
          fi
      - name: Name, checksum and summary
        run: |
          mkdir dist
          cp apps/trakta_app/build/app/outputs/flutter-apk/app-release.apk dist/trakta.apk
          (cd dist && sha256sum trakta.apk > SHA256SUMS.txt)
          {
            echo "### Android $VERSION (APK)"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo "certificate SHA-256: $RELEASE_CERT_SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/trakta.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ needs.prepare.outputs.version }}
          path: dist/
          retention-days: 90

  android-play:
    needs: [checks, prepare]
    # Skipped until Google Play is set up (docs/releasing.md).
    if: vars.ANDROID_PACKAGE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
      # Empty until the Play API is set up: the bundle is then built, signed
      # and kept as an artifact for a manual upload.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Application ID is the one configured for publishing
        run: |
          grep -q "applicationId = \"$PACKAGE_NAME\"" apps/trakta_app/android/app/build.gradle.kts || {
            echo "::error::applicationId in build.gradle.kts is not $PACKAGE_NAME."
            exit 1
          }
      - uses: ./.github/actions/setup-app
        with:
          android: 'true'
          cache: 'false'
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/trakta_app/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing in the release environment."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Build app bundle
        working-directory: apps/trakta_app
        run: flutter build appbundle --release --dart-define=TRAKTA_CHANNEL=play
      - name: Merged release manifest has no INTERNET permission
        run: dart run tool/bin/check_offline.dart
      - name: Bundle is not signed with the debug key
        run: |
          aab=apps/trakta_app/build/app/outputs/bundle/release/app-release.aab
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key."
            exit 1
          fi
          {
            echo "### Android $VERSION (Google Play)"
            echo "Upload certificate (compare with Play Console → App integrity):"
            echo '```'
            keytool -printcert -jarfile "$aab" | grep -E "Owner:|SHA256:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ needs.prepare.outputs.version }}
          path: apps/trakta_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: No Play API access yet, upload by hand
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set. Download the android-$VERSION artifact and upload app-release.aab in Play Console."
          echo "Not uploaded: download the **android-$VERSION** artifact from this run and upload \`app-release.aab\` in Play Console → Test and release → Internal testing." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: apps/trakta_app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          # "draft" until the app has been published once in Play Console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    needs: [checks, prepare]
    # Skipped until App Store Connect is set up (docs/releasing.md).
    if: vars.IOS_BUNDLE_ID != '' && vars.APPLE_TEAM_ID != ''
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # App Store Connect only accepts builds made with a recent iOS SDK.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Bundle ID is the one configured for publishing
        run: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" apps/trakta_app/ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER is not $BUNDLE_ID."
            exit 1
          }
      - uses: ./.github/actions/setup-app
        with:
          cache: 'false'
      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::App Store Connect secrets or the APPLE_TEAM_ID variable are missing."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Prepare the Xcode project (version, pods, native assets)
        working-directory: apps/trakta_app
        run: flutter build ios --release --config-only --dart-define=TRAKTA_CHANNEL=apple
      - name: Archive
        # Automatic (cloud) signing with the API key: no certificates or
        # profiles to keep in secrets. The key needs the Admin role.
        working-directory: apps/trakta_app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 90
      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  github-release:
    # A draft with the APK, its checksum and the notes from CHANGELOG.md.
    # Publishing it (by hand, after testing the APK on a phone) is what makes
    # it the download on trakta.app. Runs when no store job failed (a store
    # that is not set up yet is skipped, not failed).
    needs: [prepare, android-apk, android-play, ios]
    if: ${{ !failure() && !cancelled() && needs.android-apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NAME: ${{ needs.prepare.outputs.name }}
      RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Checksum still matches
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            awk -v v="$NAME" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo
            echo "### Install"
            echo
            echo "Android: download \`trakta.apk\` below, or follow the steps on https://trakta.app/ladda-ner/ (English: https://trakta.app/en/download/)."
            echo "The app has no internet access, so it never checks for updates itself. [Obtainium](https://obtainium.imranr.dev/) can install new versions from this repository."
            echo
            echo "### Verify"
            echo
            echo "- Signing certificate SHA-256: \`$RELEASE_CERT_SHA256\`"
            echo "- Checksum: \`sha256sum -c SHA256SUMS.txt\`"
            echo "- Build provenance: \`gh attestation verify trakta.apk --repo $GITHUB_REPOSITORY\`"
          } > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Trakta $NAME" --notes-file notes.md dist/trakta.apk dist/SHA256SUMS.txt
          echo "Draft release created. Install \`trakta.apk\` from it on a real phone over the previous version, then publish it on GitHub (docs/releasing.md)." >> "$GITHUB_STEP_SUMMARY"
