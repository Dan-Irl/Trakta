include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
  exclude:
    - "**/*.g.dart"
    - "**/build/**"
    - "apps/trakta_app/lib/l10n/app_localizations*.dart"

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - always_declare_return_types
    - unawaited_futures
